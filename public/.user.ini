; Nastavení PHP pro tuto doménu. Server běží jako FastCGI (cgi-fcgi), takže
; čte .user.ini z adresáře spouštěného skriptu — je to jediná cesta, jak měnit
; direktivy typu PHP_INI_PERDIR, které panel hostingu ve formuláři nenabízí
; a ini_set() je za běhu nezmění.
;
; Změna se projeví nejpozději do pěti minut (user_ini.cache_ttl).

; PHP jinak přidá do každé zprávy odeslané přes mail() hlavičku
; X-PHP-Originating-Script s uid a cestou ke skriptu. Spamové filtry ji berou
; jako signál strojově generované pošty a zbytečně tím zvyšují skóre.
mail.add_x_header = Off
