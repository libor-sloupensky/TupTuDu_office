name: Remote RM (smazání adresáře na serveru)

# Nástroj pro úklid po stěhování — smaže adresář včetně obsahu přes SFTP.
# Záměrně vyžaduje vypsat potvrzení, aby nešel spustit omylem jedním klikem.
# Před smazáním vypíše obsah, ať je v logu vidět, co zmizelo.

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Absolutní cesta k adresáři (např. /data/laravel-office)'
        type: string
        required: true
      confirm:
        description: 'Napiš SMAZAT pro potvrzení'
        type: string
        required: true

env:
  SFTP_HOST: ${{ vars.SFTP_HOST || 'irene.thinline.cz' }}
  SFTP_USER: ${{ vars.SFTP_USER || 'tuptudu_cz' }}
  SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}

jobs:
  rm:
    runs-on: ubuntu-latest
    # Mazání jde přes SFTP soubor po souboru, takže adresář s vendorem
    # (~10 tisíc souborů) trvá klidně půl hodiny.
    timeout-minutes: 60
    if: ${{ github.event.inputs.confirm == 'SMAZAT' }}

    steps:
    - name: Smazání adresáře
      env:
        SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        CESTA: ${{ github.event.inputs.path }}
      run: |
        sudo apt-get install -y lftp
        SFTP_PASS_ENC=$(printf %s "$SFTP_PASSWORD" | jq -sRr @uri)

        case "$CESTA" in
          /|/office.tuptudu.cz|/tuptudu.cz|"")
            echo "Odmítám mazat $CESTA — to je kořen nebo webroot."
            exit 1
            ;;
        esac

        echo "=== Obsah před smazáním ==="
        lftp -e "
          set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -p $SFTP_PORT';
          open sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST;
          find -d 2 $CESTA;
          quit
        "

        echo ""
        echo "=== Mažu $CESTA ==="
        lftp -e "
          set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -p $SFTP_PORT';
          set net:timeout 60;
          open sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST;
          rm -r -f $CESTA;
          quit
        "

        echo ""
        echo "=== Kontrola po smazání ==="
        lftp -e "
          set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -p $SFTP_PORT';
          open sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST;
          find -d 1 $CESTA;
          quit
        " || echo "Adresář už neexistuje."
