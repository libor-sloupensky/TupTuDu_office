name: Remote LS (průzkum serveru)

# Pomocná akce pro stěhování hostingu: vypíše strukturu adresářů na serveru,
# aby se daly správně nastavit proměnné REMOTE_APP a REMOTE_PUB.
# Spouští se ručně: Actions → Remote LS → Run workflow.

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Adresář k výpisu (výchozí domovský adresář)'
        type: string
        default: '/'
      depth:
        description: 'Hloubka zanoření'
        type: string
        default: '2'
      protocol:
        description: 'Protokol — sftp (port 22) nebo ftp (port 21)'
        type: choice
        options: [sftp, ftp]
        default: sftp

env:
  SFTP_HOST: ${{ vars.SFTP_HOST || 'irene.thinline.cz' }}
  SFTP_USER: ${{ vars.SFTP_USER || 'tuptudu_cz' }}
  SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}

jobs:
  ls:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Výpis vzdálených adresářů
      env:
        SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get install -y lftp
        SFTP_PASS_ENC=$(printf %s "$SFTP_PASSWORD" | jq -sRr @uri)

        # Porovnání sftp vs ftp — každý protokol může mít jiný domovský adresář
        if [ "${{ github.event.inputs.protocol }}" = "ftp" ]; then
          URL="ftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST:21"
        else
          URL="sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST"
        fi

        lftp -e "
          set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SFTP_PORT';
          set ftp:ssl-allow no;
          set net:timeout 60;
          open $URL;
          pwd;
          cls -l;
          find -d ${{ github.event.inputs.depth }} ${{ github.event.inputs.path }};
          quit
        "
