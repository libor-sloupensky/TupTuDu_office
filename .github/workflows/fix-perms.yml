name: Fix permissions

on:
  workflow_dispatch:

env:
  SFTP_HOST: ${{ vars.SFTP_HOST || 'irene.thinline.cz' }}
  SFTP_USER: ${{ vars.SFTP_USER || 'tuptudu_cz' }}
  SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
  REMOTE_PUB: ${{ vars.REMOTE_PUB || '/office.tuptudu.cz' }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Upload and run fix-perms script
      env:
        SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get install -y lftp
        SFTP_PASS_ENC=$(printf %s "$SFTP_PASSWORD" | jq -sRr @uri)

        # Skript si sám najde kořen Laravelu (laravel-office) nad webrootem,
        # takže funguje bez ohledu na strukturu adresářů hostingu.
        cat > /tmp/fix-perms.php << 'EOF'
        <?php
        $key = isset($_GET['key']) ? $_GET['key'] : '';
        if ($key !== 'deploy-fix-2026') { http_response_code(403); echo 'Forbidden'; exit; }

        $dirs = [__DIR__];

        // Hledej laravel-office až 6 úrovní nad webrootem
        $probe = __DIR__;
        for ($i = 0; $i < 6; $i++) {
            $probe = dirname($probe);
            if (is_dir($probe . '/laravel-office')) {
                $dirs[] = $probe . '/laravel-office';
                break;
            }
        }

        $results = [];
        foreach ($dirs as $dir) {
            if (!is_dir($dir)) {
                $results[] = "SKIP: $dir not found";
                continue;
            }
            $count = 0;
            $it = new RecursiveIteratorIterator(
                new RecursiveDirectoryIterator($dir, RecursiveDirectoryIterator::SKIP_DOTS),
                RecursiveIteratorIterator::SELF_FIRST
            );
            foreach ($it as $file) {
                $path = $file->getPathname();
                // storage a bootstrap/cache musí být zapisovatelné
                $writable = strpos($path, '/storage/') !== false
                         || strpos($path, '/bootstrap/cache') !== false;
                if ($file->isDir()) {
                    $perm = $writable ? 0775 : 0755;
                } else {
                    $perm = $writable ? 0664 : 0644;
                }
                if (@chmod($path, $perm)) {
                    $count++;
                }
            }
            $results[] = "OK: $dir - changed $count items";
        }

        echo implode("\n", $results);
        EOF

        lftp -e "
          set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -p $SFTP_PORT';
          set xfer:clobber on;
          open sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST;
          put /tmp/fix-perms.php -o $REMOTE_PUB/fix-perms.php;
          quit
        " || echo "Upload selhal"

        echo "=== Volám office.tuptudu.cz ==="
        curl -s "https://office.tuptudu.cz/fix-perms.php?key=deploy-fix-2026" || echo "curl selhal"
        echo ""

        # Úklid
        lftp -e "
          set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -p $SFTP_PORT';
          open sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST;
          rm -f $REMOTE_PUB/fix-perms.php;
          quit
        " || true
