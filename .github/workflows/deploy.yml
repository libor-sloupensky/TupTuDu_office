name: Deploy Office to SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full:
        description: 'Kompletní deploy — nahraje všechny soubory včetně vendoru'
        type: boolean
        default: false

# Nastavení serveru. Vše je přepsatelné bez commitu přes
# GitHub → Settings → Secrets and variables → Actions → Variables.
env:
  SFTP_HOST: ${{ vars.SFTP_HOST || 'irene.thinline.cz' }}
  SFTP_USER: ${{ vars.SFTP_USER || 'tuptudu_cz' }}
  SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
  # Kořen Laravelu (mimo webroot) a webroot subdomény office.tuptudu.cz
  REMOTE_APP: ${{ vars.REMOTE_APP || '/laravel-office' }}
  REMOTE_PUB: ${{ vars.REMOTE_PUB || '/office.tuptudu.cz' }}
  # Rozcestník na hlavní doméně. Prázdné = landing/ se nenasazuje.
  REMOTE_LANDING: ${{ vars.REMOTE_LANDING || '' }}
  PROD_DB_HOST: ${{ vars.DB_HOST || '127.0.0.1' }}
  PROD_DB_NAME: ${{ vars.DB_NAME || 'tuptuducz' }}
  PROD_DB_USER: ${{ vars.DB_USER || 'tuptuducz001' }}
  # Odchozí pošta (komunikační adresa aplikace)
  PROD_MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.cesky-hosting.cz' }}
  PROD_MAIL_USER: ${{ vars.MAIL_USER || 'info@tuptudu.cz' }}
  # Sběrná schránka dokladů — mailový koš pro {IČO}@tuptudu.cz
  PROD_IMAP_HOST: ${{ vars.IMAP_HOST || 'mail.cesky-hosting.cz' }}
  PROD_IMAP_USER: ${{ vars.IMAP_USER || 'doklady@tuptudu.cz' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Determine changes
      id: changes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Základ pro diff je poslední ÚSPĚŠNĚ nasazený commit, ne předchozí push.
        # Kdyby se porovnávalo s github.event.before, soubory ze selhaného
        # deploye by se v dalším pushi neobjevily a nikdy by se nenahrály.
        # Ruční spuštění s full=true nahraje celý projekt — nutné při stěhování
        # na nový server, kde diff proti poslednímu deployi nedává smysl.
        if [ "${{ github.event.inputs.full }}" = "true" ]; then
          echo "Kompletní deploy vyžádán ručně — nahrávám všechno."
          git ls-files > /tmp/changed_files.txt
          echo "vendor_changed=true" >> $GITHUB_OUTPUT
          echo "File count: $(wc -l < /tmp/changed_files.txt)"
          exit 0
        fi

        BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=1" \
                 --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)

        if [ -n "$BASE" ] && [ "$BASE" != "null" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          echo "Základ pro diff: poslední úspěšný deploy $BASE"
          git diff --name-only "$BASE" HEAD > /tmp/changed_files.txt
        else
          echo "Poslední úspěšný deploy nenalezen — nahrávám všechno."
          git ls-files > /tmp/changed_files.txt
        fi

        if grep -q "composer.lock" /tmp/changed_files.txt; then
          echo "vendor_changed=true" >> $GITHUB_OUTPUT
        else
          echo "vendor_changed=false" >> $GITHUB_OUTPUT
        fi

        echo "Changed files in this push:"
        cat /tmp/changed_files.txt
        echo "---"
        echo "File count: $(wc -l < /tmp/changed_files.txt)"

    - name: Setup PHP
      if: steps.changes.outputs.vendor_changed == 'true'
      uses: shivammathur/setup-php@v2
      with:
        # Musí odpovídat verzi PHP na hostingu, jinak vendor spadne na platform check
        php-version: ${{ vars.PHP_VERSION || '8.4' }}
        extensions: mbstring, xml, curl, zip, openssl

    - name: Install Composer dependencies
      if: steps.changes.outputs.vendor_changed == 'true'
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Generate last push timestamp
      run: echo "$(TZ='Europe/Prague' date '+%d.%m.%Y %H:%M:%S')" > ./public/last_push.txt

    - name: Prepare .env for upload
      run: |
        cat > /tmp/deploy.env << 'ENVEOF'
        APP_NAME=TupTuDu
        APP_ENV=production
        APP_KEY=base64:x9sz+bK9NHPqN/gYkys0Y+3oqy0dkeCk1/oJtfKF/kQ=
        APP_DEBUG=true
        APP_URL=https://office.tuptudu.cz

        LOG_CHANNEL=single
        LOG_LEVEL=error

        DB_CONNECTION=mysql
        DB_HOST=${{ env.PROD_DB_HOST }}
        DB_PORT=3306
        DB_DATABASE=${{ env.PROD_DB_NAME }}
        DB_USERNAME=${{ env.PROD_DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}

        SESSION_DRIVER=cookie
        SESSION_LIFETIME=120
        FILESYSTEM_DISK=local
        QUEUE_CONNECTION=sync
        # file, ne array — array cache nepřežije request, takže by nefungoval
        # one-time token pro Google login v mobilní appce ani throttle: limity
        CACHE_STORE=file

        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION=eu-west-1
        AWS_BUCKET=tuptudu-doklady

        ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

        MAIL_MAILER=smtp
        MAIL_HOST=${{ env.PROD_MAIL_HOST }}
        MAIL_PORT=587
        MAIL_USERNAME=${{ env.PROD_MAIL_USER }}
        MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD_INFO }}
        MAIL_ENCRYPTION=tls
        MAIL_FROM_ADDRESS=${{ env.PROD_MAIL_USER }}
        MAIL_FROM_NAME=TupTuDu
        # Doména adres pro příjem dokladů ({IČO}@doména) i pro odpovědi na ně.
        # Mailový koš domény doručuje všechny {IČO}@tuptudu.cz do doklady@tuptudu.cz.
        MAIL_DOKLADY_DOMAIN=${{ vars.MAIL_DOKLADY_DOMAIN || 'tuptudu.cz' }}

        IMAP_SYSTEM_HOST=${{ env.PROD_IMAP_HOST }}
        IMAP_SYSTEM_PORT=993
        IMAP_SYSTEM_ENCRYPTION=ssl
        IMAP_SYSTEM_USERNAME=${{ env.PROD_IMAP_USER }}
        IMAP_SYSTEM_PASSWORD=${{ secrets.MAIL_PASSWORD_DOKLADY }}

        GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
        ENVEOF
        # Remove leading spaces (heredoc indentation)
        sed -i 's/^        //' /tmp/deploy.env

    - name: Deploy changed files via lftp
      env:
        SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get install -y lftp

        # Heslo se dává do URL, takže musí být URL-encoded (může obsahovat @, /, : …)
        SFTP_PASS_ENC=$(printf %s "$SFTP_PASSWORD" | jq -sRr @uri)

        CHANGED_FILES=$(cat /tmp/changed_files.txt)
        echo "Files to deploy:"
        echo "$CHANGED_FILES"

        # Build lftp script with only changed files
        LFTP_SCRIPT=""
        DIRS_CREATED=""

        for file in $CHANGED_FILES; do
          # Skip deleted files
          if [ ! -f "$file" ]; then
            echo "SKIP (deleted): $file"
            continue
          fi

          TARGET=""
          case "$file" in
            app/*|bootstrap/*|config/*|database/*|resources/*|routes/*)
              TARGET="$REMOTE_APP/$file"
              ;;
            public/*)
              TARGET="$REMOTE_PUB/${file#public/}"
              ;;
            artisan|composer.json|composer.lock)
              TARGET="$REMOTE_APP/$file"
              ;;
            landing/*)
              if [ -n "$REMOTE_LANDING" ]; then
                TARGET="$REMOTE_LANDING/${file#landing/}"
              fi
              ;;
          esac

          if [ -n "$TARGET" ]; then
            # Ensure remote directory exists (deduplicate mkdir calls)
            DIR=$(dirname "$TARGET")
            if ! echo "$DIRS_CREATED" | grep -qF "$DIR"; then
              LFTP_SCRIPT="${LFTP_SCRIPT}mkdir -pf $DIR;"
              DIRS_CREATED="${DIRS_CREATED}${DIR}\n"
            fi
            LFTP_SCRIPT="${LFTP_SCRIPT}put $file -o $TARGET;"
            echo "UPLOAD: $file -> $TARGET"
          fi
        done

        # Zapisovatelné adresáře Laravelu — na novém serveru ještě nemusí existovat
        for d in storage/framework/sessions storage/framework/views \
                 storage/framework/cache/data storage/logs \
                 storage/app/private storage/app/public bootstrap/cache; do
          LFTP_SCRIPT="mkdir -pf $REMOTE_APP/$d;${LFTP_SCRIPT}"
        done

        # Always upload .env and last_push.txt
        LFTP_SCRIPT="${LFTP_SCRIPT}put /tmp/deploy.env -o $REMOTE_APP/.env;"
        LFTP_SCRIPT="${LFTP_SCRIPT}put public/last_push.txt -o $REMOTE_PUB/last_push.txt;"

        echo ""
        echo "Connecting to SFTP ($SFTP_USER@$SFTP_HOST:$SFTP_PORT)..."
        echo "LFTP commands: ${LFTP_SCRIPT}"

        # SFTP občas spojení vůbec nepřijme (Connection timed out).
        # Vlastní lftp retries nestačí — celý přenos opakujeme až 3x s pauzou.
        for pokus in 1 2 3; do
          echo "--- pokus $pokus/3 ---"
          if lftp -e "
            set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SFTP_PORT';
            set xfer:clobber on;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 10;
            open sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST;
            ${LFTP_SCRIPT}
            quit
          "; then
            echo "Upload complete."
            exit 0
          fi
          echo "Pokus $pokus selhal."
          [ "$pokus" -lt 3 ] && sleep 60
        done

        echo "Upload se nepodařil ani na třetí pokus."
        exit 1

    - name: Deploy vendor
      if: steps.changes.outputs.vendor_changed == 'true'
      env:
        SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        SFTP_PASS_ENC=$(printf %s "$SFTP_PASSWORD" | jq -sRr @uri)

        # Stejná retry logika jako u souborů — SFTP bývá nespolehlivý
        for pokus in 1 2 3; do
          echo "--- vendor, pokus $pokus/3 ---"
          if lftp -e "
            set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SFTP_PORT';
            set xfer:clobber on;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 10;
            open sftp://$SFTP_USER:$SFTP_PASS_ENC@$SFTP_HOST;
            mirror --reverse --parallel=5 --verbose --no-perms vendor/ $REMOTE_APP/vendor/;
            quit
          "; then
            exit 0
          fi
          echo "Pokus $pokus selhal."
          [ "$pokus" -lt 3 ] && sleep 60
        done

        exit 1

    # MariaDB Českého hostingu poslouchá jen na 127.0.0.1, takže migrace nelze
    # spustit přes síť z runneru — vyvolá je aplikace sama přes tajnou routu.
    # Deploy souborů na případném selhání migrací nepadá.
    - name: Run DB migrations
      continue-on-error: true
      env:
        CRON_TOKEN: ${{ vars.CRON_TOKEN || 'f8k2Ld9xQm4vR7nW' }}
      run: |
        APP_URL="${{ vars.APP_URL || 'https://office.tuptudu.cz' }}"
        echo "Spouštím migrace na $APP_URL ..."
        HTTP_CODE=$(curl -sS --max-time 300 -o /tmp/migrace.txt -w "%{http_code}" \
          "$APP_URL/deploy-migrace/$CRON_TOKEN" || echo "000")
        cat /tmp/migrace.txt
        echo ""
        echo "HTTP status: $HTTP_CODE"
        [ "$HTTP_CODE" = "200" ]

    - name: Verify deployment
      run: |
        echo "Checking office.tuptudu.cz..."
        HTTP_CODE=$(curl -s -o /tmp/response.html -w "%{http_code}" https://office.tuptudu.cz/ || echo "000")
        echo "HTTP status: $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          echo "Site is up!"
        else
          echo "Response body:"
          head -50 /tmp/response.html
        fi
        echo ""
        echo "Checking last_push.txt..."
        curl -s https://office.tuptudu.cz/last_push.txt || echo "(not accessible)"