name: Cron (email + Google Drive)

# Náhrada za cron hostingu — pinguje cron routy aplikace.
# Zapíná se proměnnou CRON_ENABLED=1 (Settings → Variables → Actions),
# aby se dala plánovaná úloha vypnout bez commitu.
#
# GitHub plánované úlohy spouští nepřesně — při zatížení je odkládá i o desítky
# minut a některé přeskočí. Samotné `*/5` by tedy doklady z emailu zdržovalo.
# Každý běh proto uvnitř pinguje schránku po minutě, takže i když se spustí jen
# část naplánovaných běhů, kontrola pošty zůstává v řádu minut.
#
# Pozor: GitHub plánované workflow uspí po 60 dnech bez aktivity v repu.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  APP_URL: ${{ vars.APP_URL || 'https://office.tuptudu.cz' }}
  CRON_TOKEN: ${{ secrets.SERVISNI_TOKEN }}

# Kdyby se běhy překryly (opožděné spuštění), starý se ukončí — jinak by se
# ve frontě hromadily a pingovaly schránku několikrát naráz.
concurrency:
  group: cron
  cancel-in-progress: true

jobs:
  cron:
    runs-on: ubuntu-latest
    # Strop běhu u GitHubu je 6 hodin; 5,5 hodiny nechává rezervu.
    timeout-minutes: 350
    if: ${{ vars.CRON_ENABLED == '1' }}

    steps:
    # Jeden běh pokrývá 5,5 hodiny. Původně to byla hodina s tím, že se za ni
    # aspoň jedno z naplánovaných spuštění chytí — jenže GitHub jich přeskakuje
    # mnohem víc, než se čekalo: reálně startuje jeden běh za 2 až 5 hodin.
    # Schránka se pak kontrolovala necelou hodinu z každých několika a doklad
    # poslaný do té mezery čekal i hodiny.
    #
    # Repozitář je veřejný, takže minuty Actions nic nestojí a delší běh je
    # zadarmo. Nový naplánovaný běh ten starý ukončí (cancel-in-progress),
    # takže se smyčky nehromadí.
    #
    # Drive sync se volá uvnitř smyčky, ne až za ní: na krok za smyčkou by řada
    # skoro nikdy nedošla a zálohování by stálo.
    - name: Zpracování dokladů (schránka po minutě, Drive po deseti)
      run: |
        for i in $(seq 1 330); do
          echo "--- kontrola schránky $i/330 ($(date '+%H:%M:%S')) ---"
          curl -sS --max-time 240 "$APP_URL/cron/$CRON_TOKEN" || echo "cron/email selhal"

          # Drive nahrává po 50 dokladech, každou minutu by to bylo zbytečné
          if [ $((i % 10)) -eq 0 ]; then
            echo "--- synchronizace na Google Drive ---"
            curl -sS --max-time 300 "$APP_URL/cron-drive/$CRON_TOKEN" || echo "cron/drive selhal"
          fi

          # Ne `[ … ] && sleep` — při poslední iteraci vrátí nepravdu a protože
          # je to poslední příkaz kroku, celý krok by skončil chybou.
          if [ "$i" -lt 330 ]; then sleep 60; fi
        done
